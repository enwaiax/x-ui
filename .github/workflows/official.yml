name: builder official

on:
  workflow_dispatch:
    inputs:
      xui_version:
        description: 3x-ui git tag or branch
        required: false
        default: v3.6.0
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read
  packages: write

jobs:
  buildx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image names
        id: meta
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          echo "dockerhub=$(echo "${DOCKERHUB_USERNAME}/${GITHUB_REPOSITORY##*/}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "ghcr=$(echo "ghcr.io/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "xui_version=${{ github.event.inputs.xui_version || 'v3.6.0' }}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: build_image
          platforms: linux/amd64,linux/arm64,linux/s390x,linux/arm/v7
          push: true
          build-args: |
            XUI_VERSION=${{ steps.meta.outputs.xui_version }}
          tags: |
            ${{ steps.meta.outputs.dockerhub }}:latest
            ${{ steps.meta.outputs.dockerhub }}:3x-ui
            ${{ steps.meta.outputs.dockerhub }}:${{ steps.meta.outputs.xui_version }}
            ${{ steps.meta.outputs.ghcr }}:latest
            ${{ steps.meta.outputs.ghcr }}:3x-ui
            ${{ steps.meta.outputs.ghcr }}:${{ steps.meta.outputs.xui_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sync README.md
        uses: ms-jpq/sync-dockerhub-readme@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}
          readme: "./docs/README_zh.md"
